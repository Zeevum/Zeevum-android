name: Build and Release (Client)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: List build artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse target\release -Include *.exe | Select-Object FullName

      - name: Prepare artifact
        shell: pwsh
        run: |
          mkdir staging
          copy target\release\<РЕАЛЬНОЕ_ИМЯ>.exe staging\
          Compress-Archive -Path staging\* -DestinationPath zeevum-client-windows-x64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: zeevum-client-windows-x64.zip
          prerelease: ${{ contains(github.ref_name, '-') }}